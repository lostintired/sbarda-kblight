schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: KbLight — утилита в трее Windows, которая держит подсветку клавиатуры sbarda
  (USB VID 19F5, PID FB2A, вендорский HID-интерфейс MI_01) такой, какую выбрал пользователь:
  пишет её в клавиатуру при входе в Windows, при подключении клавиатуры, после сна и при каждой
  правке в окне. Заменяет вендорскую sbarda.exe только для подсветки: та при запуске подсветку
  не пишет, а её автозапуск ссылался на несуществующий «G68 Ultra.exe». Раскладка, макросы,
  срабатывание клавиш и прочие настройки клавиатуры — вне проекта (docs/ADR.md, ADR-002).
  Стек: C# / .NET 10 (net10.0-windows, win-x64), WinForms, без NuGet-зависимостей; HID через
  P/Invoke (cfgmgr32, hid.dll, overlapped I/O kernel32). Поставка — один KbLight.exe
  (dotnet publish, нужен .NET Desktop Runtime 10), ставится копированием в
  %LOCALAPPDATA%\Programs\KbLight; автозапуск — задача планировщика KbLight. Windows 11,
  один пользователь, без прав администратора.
  Язык интерфейса и журнала — русский или английский по языку Windows (spec interface-language);
  документы — по-русски; комментарии в коде — английские.
  Автотестов нет: поведение завязано на живую клавиатуру, проверка — ручные сценарии из CLAUDE.md.
  Протокол клавиатуры восстановлен разбором sbarda.exe 1.0.0.0 и описан в docs/PROTOCOL.md с
  пометками: проверено на устройстве / выведено из кода sbarda.exe / не расшифровано.
  Источники: поведение — openspec/specs/; устройство программы — docs/ARCHITECTURE.md;
  решения — docs/ADR.md; протокол — docs/PROTOCOL.md; для пользователя — README.md;
  правила работы — CLAUDE.md; версии — docs/CHANGELOG.md.

rules:
  proposal:
    - Всегда раздел «Не входит» (non-goals)
    - Назвать затронутые capability из openspec/specs/
    - Новая команда протокола или новый байт блока настроек — только с планом проверки на клавиатуре (tools/kbtool.py или перехват tools/capture/)
  specs:
    - Тексты окна, меню, подсказки значка и журнала — по-русски, дословно, как в программе
    - Требование описывает наблюдаемое поведение (что уходит в клавиатуру, что видно в окне и трее, что лежит в файлах, журнале и планировщике), а не устройство кода
    - Байты протокола в требованиях — только подтверждённые на клавиатуре; гипотезы живут в docs/PROTOCOL.md с пометкой
  design:
    - Запись в клавиатуру — только «прочитать блок → поменять свои байты → записать → перечитать и сверить» (ADR-003); чужие байты блока не трогать
    - Обмен с клавиатурой — вне потока окна, через очередь записи TrayApp; разовые режимы — через Keyboard.Apply с мьютексом устройства
  tasks:
    - Каждая задача заканчивается проверяемым результатом — сборка без ошибок и предупреждений, ручной сценарий с ожидаемой строкой журнала или чтение блока через tools/kbtool.py
    - Последняя группа задач — документы (docs/CHANGELOG.md; README.md, если поменялось видимое пользователю; docs/ARCHITECTURE.md и docs/PROTOCOL.md, если поменялись устройство программы или протокол)

operations:
  apply:
    guidance:
      - Перед началом прочитать CLAUDE.md целиком
      - Ворота — dotnet build src -c Release без ошибок и предупреждений; при правке записи в клавиатуру — ещё ручные сценарии из CLAUDE.md («Проверка»)
      - Перед опытами с клавиатурой закрыть sbarda.exe, а после них вернуть подсветку пользователя — KbLight.exe --apply
      - Рабочую установку в %LOCALAPPDATA%\Programs\KbLight обновлять только по просьбе пользователя
  archive:
    guidance:
      - Перед архивом сверить README.md, docs/ARCHITECTURE.md, docs/PROTOCOL.md и docs/CHANGELOG.md с поведением из спек; разошлись — назвать где
